<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">ONNX Compiler — PureBasic</title>
  <desc id="desc">A model graph becomes readable BASIC source. Native generation, reusable models, five target profiles.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1222"/><stop offset="1" stop-color="#152845"/></linearGradient>
