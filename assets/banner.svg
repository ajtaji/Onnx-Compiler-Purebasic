  <rect x="48" y="48" width="4" height="201" rx="2" fill="url(#accent)"/>
  <text x="78" y="86" fill="#66ddce" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="4">FROM MODEL TO SOURCE</text>
  <text x="76" y="146" fill="#f1f6ff" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="700">ONNX Compiler</text>
  <text x="78" y="187" fill="#a7c6ef" font-family="Segoe UI,Arial,sans-serif" font-size="28">Written in PureBasic.</text>
  <text x="78" y="238" fill="#aebbd0" font-family="Segoe UI,Arial,sans-serif" font-size="17">Native generation · Resident models · Five target profiles</text>
